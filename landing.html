<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>여행비서 - 스케줄 생성</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #f8fafc;
      --text: #0f172a;
      --gray: #64748b;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Pretendard', -apple-system, sans-serif; 
    }
    
    body {
      background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
    }
    
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: white;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    
    /* 상단 이미지 / 헤더 영역 */
    .header-hero {
      height: 40vh;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.2)), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      color: white;
      position: relative;
    }
    
    .app-logo-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: auto; /* 로고는 위로, 텍스트는 아래로 자연스럽게 밀어냄 */
      background: white;
      padding: 16px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    
    .app-logo {
      height: 72px; /* 열기구 크기 유지 */
      width: auto;
      object-fit: contain;
    }
    
    .app-logo-text {
      font-size: 52px; /* 폰트를 기존의 약 4~5배 수준으로 거대하게 확대 */
      font-weight: 900;
      color: #60a5fa; /* 연한 파란색으로 변경 */
      font-style: italic; /* 열기구 진행 방향에 맞춰 기울임 적용 */
      letter-spacing: -2px;
      line-height: 1;
    }
    
    .header-hero h1 { 
      font-size: 32px; 
      font-weight: 700; 
      margin-bottom: 8px; 
      line-height: 1.3; 
    }
    
    .header-hero p { 
      font-size: 16px; 
      opacity: 0.9; 
    }

    /* 폼 입력 영역 컨테이너 */
    .form-container {
      flex: 1;
      background: white;
      border-radius: 28px 28px 0 0;
      margin-top: -28px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .input-group label {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray);
    }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .input-wrapper span {
      position: absolute;
      left: 18px;
      font-size: 22px;
    }
    
    .input-wrapper input {
      width: 100%;
      padding: 18px 18px 18px 54px;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
      color: var(--text);
    }
    
    .input-wrapper input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
    }
    
    .input-wrapper input::placeholder {
      color: #94a3b8;
    }
    
    .map-toggle-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .city-checkbox-container {
      display: none;
      margin-top: -12px;
      margin-bottom: 8px;
    }
    
    .city-checkbox-container p {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 8px;
    }
    
    .city-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .city-badge-label {
      display: inline-block;
      padding: 8px 16px;
      background: #f1f5f9;
      border: 1.5px solid transparent;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    
    .city-badge-input {
      display: none;
    }
    
    .city-badge-input:checked + .city-badge-label {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .custom-city-input {
      width: 100%;
      padding: 14px 16px;
      margin-top: 12px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: var(--text);
      transition: all 0.2s;
    }
    
    .custom-city-input:focus {
      border-color: var(--primary);
      border-style: solid;
      background: white;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
    }
    
    .date-row {
      display: flex;
      gap: 16px;
    }
    
    .date-row .input-group {
      flex: 1;
    }
    
    /* input type date에서 기본 아이콘 숨기기 (모바일에 깔끔하게 보이도록) */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: auto;
      margin-bottom: 24px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 20px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(59,130,246,0.4);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    
    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(59,130,246,0.2);
    }
    
    .submit-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header-hero">
      <div class="app-logo-wrap">
        <img src="assets/logo.png" alt="여행비서 열기구" class="app-logo" />
        <span class="app-logo-text">여행비서</span>
      </div>
      <h1>어디로<br/>떠나시나요?</h1>
      <p>여행비서가 완벽한 일정을 짜드릴게요</p>
    </div>
    
    <div class="form-container">
      <div class="input-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label>여행지</label>
          <button id="map-toggle-btn" class="map-toggle-btn" type="button">🗺️ 지도에서 선택</button>
        </div>
        <div class="input-wrapper">
          <span>📍</span>
          <input type="text" placeholder="나라 또는 도시 (예: 일본 도쿄)" id="destination" autocomplete="off" />
        </div>
      </div>
      
      <!-- 구글맵 영역 (초기 숨김) -->
      <div id="map-container" style="display: none; height: 220px; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; margin-top: -12px;">
        <div id="map" style="width: 100%; height: 100%;"></div>
      </div>
      
      <!-- 주요 도시 선택 체크박스 영역 (국가 인식 시 표시) -->
      <div id="city-checkbox-container" class="city-checkbox-container">
        <p>🌟 인플루언서 추천 주요 도시 <span style="font-weight: 400; font-size: 12px; color: #94a3b8;">(다중 선택)</span></p>
        <div id="city-badges" class="city-badges"></div>
        <input type="text" id="custom-city-input" class="custom-city-input" placeholder="원하는 도시가 없다면 직접 입력해주세요 (쉼표로 구분)" autocomplete="off" />
      </div>
      
      <div class="date-row">
        <div class="input-group">
          <label>출발 날짜</label>
          <div class="input-wrapper">
            <span>🛫</span>
            <input type="date" id="start-date" />
          </div>
        </div>
        <div class="input-group">
          <label>귀국 날짜</label>
          <div class="input-wrapper">
            <span>🛬</span>
            <input type="date" id="end-date" />
          </div>
        </div>
      </div>
      
      <button class="submit-btn" id="generate-btn">스케줄 생성하기 ✨</button>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generate-btn');
    
    // 오늘 날짜를 기본값으로 설정하는 함수
    function setMinDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('start-date').min = today;
      document.getElementById('end-date').min = today;
    }
    setMinDate();

    // 출발 날짜가 바뀌면 귀국 날짜의 최소값을 출발 날짜로 조정
    document.getElementById('start-date').addEventListener('change', function(e) {
      document.getElementById('end-date').min = e.target.value;
    });

    generateBtn.addEventListener('click', () => {
      const dest = document.getElementById('destination').value.trim();
      const start = document.getElementById('start-date').value;
      const end = document.getElementById('end-date').value;
      
      if(!dest) {
        alert('여행지를 입력해주세요!');
        document.getElementById('destination').focus();
        return;
      }
      if(!start) {
        alert('출발 날짜를 선택해주세요!');
        return;
      }
      if(!end) {
        alert('귀국 날짜를 선택해주세요!');
        return;
      }
      if(start > end) {
        alert('귀국 날짜는 출발 날짜보다 늦어야 합니다.');
        return;
      }
      
      // 버튼 상태 변경 (로딩 중)
      const originalText = generateBtn.innerHTML;
      generateBtn.innerHTML = '일정 생성 중... ⏳';
      generateBtn.disabled = true;
      
      // 가짜 로딩 시뮬레이션
      setTimeout(() => {
        alert(`✈️ ${dest} 여행 스케줄이 성공적으로 생성되었습니다!\n(기간: ${start} ~ ${end})`);
        generateBtn.innerHTML = originalText;
        generateBtn.disabled = false;
      }, 1500);
    });

    // 국가별 주요 도시 데이터
    const countryCities = {
      "일본": ["도쿄", "오사카", "교토", "후쿠오카", "삿포로", "오키나와"],
      "미국": ["뉴욕", "로스앤젤레스", "샌프란시스코", "시카고", "라스베이거스", "하와이"],
      "한국": ["서울", "부산", "제주도", "강릉", "경주", "여수"],
      "대한민국": ["서울", "부산", "제주도", "강릉", "경주", "여수"],
      "프랑스": ["파리", "마르세유", "리옹", "니스", "보르도"],
      "이탈리아": ["로마", "밀라노", "피렌체", "베네치아", "나폴리"],
      "영국": ["런던", "에든버러", "맨체스터", "버밍엄"],
      "베트남": ["다낭", "나트랑", "하노이", "호치민", "푸꾸옥"],
      "태국": ["방콕", "푸껫", "치앙마이", "파타야"],
      "스페인": ["마드리드", "바르셀로나", "세비야", "그라나다"],
      "대만": ["타이베이", "가오슝", "타이중", "타이난"]
    };

    function updateCityCheckboxes(locationName) {
      const container = document.getElementById("city-checkbox-container");
      const badgesDiv = document.getElementById("city-badges");
      
      let matchedCountry = null;
      for (const country in countryCities) {
        if (locationName.includes(country)) {
          matchedCountry = country;
          break;
        }
      }

      if (matchedCountry) {
        badgesDiv.innerHTML = '';
        countryCities[matchedCountry].forEach(city => {
          const id = `city-${city}`;
          badgesDiv.insertAdjacentHTML('beforeend', `
            <div>
              <input type="checkbox" id="${id}" class="city-badge-input" value="${city}">
              <label for="${id}" class="city-badge-label">${city}</label>
            </div>
          `);
        });
        container.style.display = 'block';
      } else {
        container.style.display = 'none';
        badgesDiv.innerHTML = '';
        document.getElementById("custom-city-input").value = ''; // 다른 곳 선택 시 초기화
      }
    }

    // 텍스트 직접 입력 시 즉각 반응
    document.getElementById('destination').addEventListener('input', (e) => {
      updateCityCheckboxes(e.target.value);
    });

    // 구글 맵 API 로직
    let map, marker, geocoder;

    function initMap() {
      const defaultLocation = { lat: 37.5665, lng: 126.9780 };
      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultLocation,
        zoom: 4,
        disableDefaultUI: true,
        zoomControl: true,
      });
      geocoder = new google.maps.Geocoder();
      marker = new google.maps.Marker({ map: map });

      const input = document.getElementById("destination");
      const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["(regions)"]
      });

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place.geometry || !place.geometry.location) return;
        
        map.setCenter(place.geometry.location);
        map.setZoom(10);
        marker.setPosition(place.geometry.location);
        
        // 도시 목록 업데이트
        updateCityCheckboxes(input.value);

        const mapContainer = document.getElementById("map-container");
        if (mapContainer.style.display === "none") {
          mapContainer.style.display = "block";
          document.getElementById("map-toggle-btn").innerHTML = "닫기 ✕";
        }
      });

      map.addListener("click", (e) => {
        marker.setPosition(e.latLng);
        geocoder.geocode({ location: e.latLng }, (results, status) => {
          if (status === "OK" && results[0]) {
            input.value = results[0].formatted_address;
            // 도시 목록 업데이트
            updateCityCheckboxes(input.value);
          }
        });
      });
    }

    // 지도 토글 버튼 동작
    const mapToggleBtn = document.getElementById("map-toggle-btn");
    mapToggleBtn.addEventListener("click", () => {
      const mapContainer = document.getElementById("map-container");
      if (mapContainer.style.display === "none") {
        mapContainer.style.display = "block";
        mapToggleBtn.innerHTML = "닫기 ✕";
      } else {
        mapContainer.style.display = "none";
        mapToggleBtn.innerHTML = "🗺️ 지도에서 선택";
      }
    });
  </script>
  <!-- 실제 서비스 시 아래 스크립트에 key=발급받은API키 파라미터를 추가해야 워터마크 없이 정상 작동합니다. -->
  <script src="https://maps.googleapis.com/maps/api/js?libraries=places&callback=initMap" async defer></script>
</body>
</html>
