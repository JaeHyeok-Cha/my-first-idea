<!DOCTYPE html>
<!-- Build trigger: 2026-05-15 -->
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘도 힘내세요!</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 배경 그라데이션 오브 */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatOrb 8s ease-in-out infinite;
    }

    .orb1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #e0e7ff, transparent);
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }

    .orb2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #dbeafe, transparent);
      bottom: -120px;
      right: -120px;
      animation-delay: 3s;
    }

    .orb3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #f1f5f9, transparent);
      top: 50%;
      left: 60%;
      animation-delay: 5s;
    }

    @keyframes floatOrb {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    /* 중앙 카드 */
    .card {
      position: relative;
      text-align: center;
      padding: 60px 80px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      animation: fadeInUp 0.9s ease both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .label {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #3b82f6;
      margin-bottom: 24px;
      background: rgba(59, 130, 246, 0.1);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    h1 {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.2;
      color: #1e293b;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
      transition: opacity 0.3s ease;
    }

    .underline-bar {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 4px;
      margin: 28px auto 0;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      animation: expandBar 1.2s ease 0.4s both;
    }

    @keyframes expandBar {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: 80px;
        opacity: 1;
      }
    }

    /* 반짝이는 별 효과 */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      animation: sparkle 2s ease-in-out infinite;
    }

    .sparkle:nth-child(1) {
      top: 18px;
      left: 30px;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 25px;
      right: 40px;
      animation-delay: 0.7s;
    }

    .sparkle:nth-child(3) {
      bottom: 20px;
      left: 50px;
      animation-delay: 1.3s;
    }

    .sparkle:nth-child(4) {
      bottom: 30px;
      right: 25px;
      animation-delay: 0.4s;
    }

    @keyframes sparkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .next-btn {
      margin-top: 40px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.3s ease;
      animation: fadeInUp 0.9s ease 0.6s both;
    }

    .next-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.5);
    }

    .next-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
    }

    /* 동적 버튼 색상 */
    .next-btn.yellow {
      background: #eab308;
      box-shadow: 0 8px 20px rgba(234, 179, 8, 0.4);
    }

    .next-btn.yellow:hover {
      background: #ca8a04;
      box-shadow: 0 12px 24px rgba(234, 179, 8, 0.5);
    }

    .next-btn.orange {
      background: #f97316;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
    }

    .next-btn.orange:hover {
      background: #ea580c;
      box-shadow: 0 12px 24px rgba(249, 115, 22, 0.5);
    }

    .next-btn.green {
      background: #22c55e;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
    }

    .next-btn.green:hover {
      background: #16a34a;
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>

<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="card">
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="label">✦ Idea No. 1</div>
    <h1 id="sentence">오늘도 힘내세요!</h1>
    <div class="underline-bar"></div>
    <button id="next-btn" class="next-btn">다음 문장 보기</button>
  </div>

  <script>
    const sentences = [
      '오늘도 힘내세요!',
      '오늘도 해냈어요!',
      '조금씩 나아지고 있어요.',
      '이대로 계속 가봅시다.'
    ];
    let currentIndex = 0;

    const sentenceEl = document.getElementById('sentence');
    const nextBtn = document.getElementById('next-btn');

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % sentences.length;

      sentenceEl.style.opacity = 0;
      setTimeout(() => {
        const nextSentence = sentences[currentIndex];
        sentenceEl.textContent = nextSentence;
        sentenceEl.style.opacity = 1;

        // 버튼 클래스 초기화 후 문장에 맞게 추가
        nextBtn.className = 'next-btn';
        if (nextSentence === '오늘도 해냈어요!') {
          nextBtn.classList.add('yellow');
        } else if (nextSentence === '조금씩 나아지고 있어요.') {
          nextBtn.classList.add('orange');
        } else if (nextSentence === '이대로 계속 가봅시다.') {
          nextBtn.classList.add('green');
        }
      }, 300);
    });
  </script>
</body>

</html>
